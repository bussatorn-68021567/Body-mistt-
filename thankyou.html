<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอบคุณสำหรับการสั่งซื้อ — BODY SCENT</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .thankyou-card {
      max-width: 560px;
      margin: 80px auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 64px 32px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar" style="padding: 24px 0; border-bottom: 1px solid var(--border-color);">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="brand-title" style="font-size: 1.5rem; font-weight: 600; letter-spacing: 0.15em; text-decoration: none; color: var(--text-main);">BODY SCENT</a>
      <nav style="display: flex; gap: 32px; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase;">
        <a href="index.html" style="text-decoration: none; color: var(--text-main);">หน้าแรก</a>
        <a href="product.html" style="text-decoration: none; color: var(--text-main);">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </header>

  <!-- Main Section -->
  <section class="section">
    <div class="container">
      <div class="thankyou-card">
        <span style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.3em; color: var(--accent-gold); display: block; margin-bottom: 16px;">Order Completed</span>
        <h1 style="font-weight: 400; font-size: 2rem; margin-bottom: 16px;">ขอบคุณสำหรับการสั่งซื้อ</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 40px; font-weight: 300;">
          ทางเราได้รับข้อมูลคำสั่งซื้อของคุณเรียบร้อยแล้ว<br>
          ทีมงานจะดำเนินการจัดส่งความหอมถึงคุณโดยเร็วที่สุด
        </p>
        <a href="index.html" class="btn" style="display: inline-block; padding: 14px 36px; border: 1px solid var(--border-color); color: var(--text-main); text-decoration: none; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase;">กลับหน้าแรก</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer style="padding: 40px 0; border-top: 1px solid var(--border-color); background: var(--bg-primary);">
    <div class="container" style="text-align: center;">
      <p class="brand-title" style="font-size: 1.2rem; letter-spacing: 0.15em; margin-bottom: 8px;">BODY SCENT</p>
      <p style="font-size: 0.8rem; color: var(--text-light);">&copy; 2026 Body Scent. All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
